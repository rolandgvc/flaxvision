[tool:pytest]
# Security testing configuration
markers =
    security: marks tests as security-related
    download_security: marks tests for download security
    parameter_security: marks tests for parameter security
    resource_security: marks tests for resource security
    slow: marks tests as slow running
    network: marks tests that require network access
    memory_intensive: marks tests that use significant memory

# Test discovery
testpaths = tests

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --durations=10

# Security test specific settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings for security tests
# Minimum coverage requirements
minversion = 6.0

# Timeout for security tests (prevent hanging)
timeout = 300

# Parallel execution settings
# Use -n auto for parallel execution with pytest-xdist
# pytest -n auto -m security

# Security test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    error::UserWarning:flaxvision.*

# Environment settings
env =
    PYTHONPATH = .
    JAX_ENABLE_X64 = true
    JAX_PLATFORM_NAME = cpu